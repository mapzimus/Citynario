[tool.uv.workspace]
members = [
    "apps/api",
    "python/citynario_core",
    "python/citynario_assistant",
    "python/citynario_data",
    "python/citynario_models",
    "city-packs/us-ma-lynn",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.17.0",
    "pre-commit>=4.2.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.7",
    "types-pyyaml>=6.0.12.20250516",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["apps/api/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]
"python/citynario_models/**/*.py" = ["RUF001"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
asyncio_mode = "auto"
testpaths = [
    "apps/api/tests",
    "python/citynario_core/tests",
    "python/citynario_assistant/tests",
    "python/citynario_data/tests",
    "python/citynario_models/tests",
    "city-packs/us-ma-lynn/tests",
]

[tool.coverage.run]
branch = true
source = [
    "citynario_api",
    "citynario_assistant",
    "citynario_core",
    "citynario_data",
    "citynario_models",
    "citynario_pack_lynn",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
