[project]
name = "citynario-assistant"
version = "0.1.0"
description = "Schema-constrained planning assistant interfaces for Citynario"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.11.7"]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/citynario_assistant"]
