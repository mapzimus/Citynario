[project]
name = "citynario-data"
version = "0.1.0"
description = "City Pack pipeline and validation framework"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11.7",
    "pyyaml>=6.0.2",
    "typer>=0.16.0",
]

[project.scripts]
citynario-data = "citynario_data.cli:app"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/citynario_data"]
